<style id="rapcer-desktop-fit-final">
@media (max-width:768px){
  html,body{
    margin:0!important;
    padding:0!important;
    background:#020617!important;
    overflow:auto!important;
  }

  #rapcerDesktopStage{
    width:max-content!important;
    min-width:1200px!important;
    transform-origin:top left!important;
    margin:0!important;
    padding:0!important;
  }

  .go-mobile-fixed,
    position:fixed!important;
    top:18px!important;
    right:18px!important;
    z-index:999999!important;
  }
}
</style>

<script id="rapcer-desktop-fit-script">
(function(){
  function fitDesktop(){
    if(window.innerWidth > 768) return;

    var existing=document.getElementById("rapcerDesktopStage");
    if(!existing){
      var stage=document.createElement("div");
      stage.id="rapcerDesktopStage";

      Array.from(document.body.children).forEach(function(el){
        if(
          el.id==="rapcer-desktop-fit-final" ||
          el.id==="rapcer-desktop-fit-script" ||
        ){
          return;
        }
        stage.appendChild(el);
      });

      document.body.insertBefore(stage, document.body.firstChild);
    }

    var box=document.getElementById("rapcerDesktopStage");
    var realWidth=box.scrollWidth || 1400;
    var scale=window.innerWidth / realWidth;

    box.style.transform="scale("+scale+")";
    box.style.height=(box.scrollHeight * scale)+"px";
    document.body.style.width=window.innerWidth+"px";
  }

  window.addEventListener("load",fitDesktop);
  window.addEventListener("resize",fitDesktop);
})();
</script>
