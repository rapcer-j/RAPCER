<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Events & Groups | RAPCER</title>
<link rel="stylesheet" href="../../../module.css">
<style>
.group-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:30px}
.group-card{padding:22px;border-radius:22px;border:1px solid rgba(120,80,255,.35);background:rgba(0,0,0,.35);color:white}
.group-card img{width:85px;height:85px;object-fit:cover;border-radius:18px;margin-bottom:12px}
.group-card a{color:#66fff1;font-weight:900}
</style>
</head>
<body>
<main class="module">
<nav class="nav">
<a href="../index.html" class="btn">← Community</a>
<a href="../../../../app-mobile.html" class="btn">RAPCER Home</a>
</nav>
<section class="agreement-hero">
<span class="package-badge">DISCORD / EVENTS</span>
<h1>Events & Groups</h1>
<p>Discord servers, GTA groups, tournaments and community events.</p>
</section>
<div id="list" class="group-grid"></div>
</main>
<script>
const items=JSON.parse(localStorage.getItem("rapcerCommunityItems")||"[]").filter(i=>i.type==="groups");
document.getElementById("list").innerHTML=items.map(i=>`
<div class="group-card">
${i.image?`<img src="${i.image}">`:""}
<h3>${i.name}</h3>
<p>Discord / Events</p>
<a href="${i.url}" target="_blank">Open Group</a>
</div>`).join("") || "<p style='color:white'>No Discord or event links added yet.</p>";
</script>
<script src="../../../../rapcer-language.js?v=16" defer></script>
</body>
</html>
