<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RAPCER Community | Coming Soon</title>
<link rel="stylesheet" href="../../module.css">

<style>
.coming-wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px;
  background:
    radial-gradient(circle at top left, rgba(0,255,210,.22), transparent 35%),
    radial-gradient(circle at bottom right, rgba(170,0,255,.25), transparent 40%),
    #02040a;
  overflow:hidden;
}

.coming-card{
  width:min(980px,100%);
  border:1px solid rgba(0,255,210,.35);
  border-radius:32px;
  padding:32px;
  background:rgba(0,0,0,.55);
  box-shadow:0 0 40px rgba(0,255,210,.18);
  text-align:center;
}

.coming-video{
  width:100%;
  max-height:380px;
  object-fit:cover;
  border-radius:24px;
  background:#000;
  margin-bottom:28px;
  border:1px solid rgba(255,255,255,.12);
}

.coming-badge{
  color:#66fff1;
  letter-spacing:.22em;
  font-size:12px;
  font-weight:900;
}

.coming-card h1{
  color:white;
  font-size:clamp(38px,7vw,82px);
  margin:14px 0;
}

.coming-card p{
  color:rgba(255,255,255,.78);
  font-size:18px;
  line-height:1.7;
  max-width:720px;
  margin:0 auto 28px;
}

.coming-actions{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  justify-content:center;
}
</style>
</head>

<body>

<section class="coming-wrap">
  <div class="coming-card">

<div class="coming-badge">RAPCER COMMUNITY</div>
    <h1>Coming Soon</h1>
    <p>
      We are building the next generation creator ecosystem inside RAPCER:
      creators, streamers, live content, Discord communities, events and digital growth tools.
    </p>

    <div class="coming-actions">
      <a class="btn" href="index.html">← Back to Community</a>
      <a class="btn" href="../../../app-mobile.html">RAPCER Home</a>
    </div>

  </div>
</section>

<script src="../../../rapcer-language.js?v=16" defer></script>
</body>
</html>
